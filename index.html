<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Spese Personali</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --primary: #4a90e2;
      --income: #2ecc71;
      --expense: #e74c3c;
      --border: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; }

    /* Auth Screen */
    .auth-card { background: var(--card-bg); padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .auth-card h2 { margin-bottom: 15px; }
    .auth-card input { margin-bottom: 10px; }
    .auth-card .btn-group { display: flex; gap: 10px; margin-top: 10px; }

    /* App Screen */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logout-btn { background: #999; font-size: 0.8rem; padding: 5px 10px; }

    .filter-container { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 10px 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .filter-container label { font-size: 0.85rem; font-weight: bold; color: #555; }
    .filter-container select { width: auto; padding: 6px 12px; font-weight: 600; }

    .dashboard { display: flex; gap: 10px; margin-bottom: 20px; }
    .card { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { font-size: 0.8rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .card p { font-size: 1.2rem; font-weight: bold; }
    .balance { color: var(--primary); }
    .income-val { color: var(--income); }
    .expense-val { color: var(--expense); }

    form { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; gap: 10px; }
    input, select, button { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; outline: none; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select { width: 100%; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }

    .transactions { background: var(--card-bg); border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; }
    .transactions h2 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    li:last-child { border-bottom: none; }
    .tx-info { display: flex; flex-direction: column; gap: 2px; }
    .tx-title { font-weight: 600; font-size: 0.95rem; }
    .tx-details { font-size: 0.75rem; color: #888; display: flex; gap: 8px; }
    .tx-amount { font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    .tx-amount.plus { color: var(--income); }
    .tx-amount.minus { color: var(--expense); }
    .delete-btn { background: none; border: none; color: #bbb; font-weight: bold; cursor: pointer; font-size: 1.1rem; padding: 0 5px; }
    .delete-btn:hover { color: var(--expense); }
    .empty-msg { text-align: center; color: #999; font-size: 0.9rem; padding: 10px 0; }
    .hidden { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    
    <!-- Schermata di Login / Registrazione -->
    <div id="auth-section" class="auth-card">
      <h2>Accedi o Registrati</h2>
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required>
      <div class="btn-group">
        <button onclick="login()">Accedi</button>
        <button onclick="signUp()" style="background: #6c757d;">Registrati</button>
      </div>
    </div>

    <!-- Schermata Principale App -->
    <div id="app-section" class="hidden">
      <div class="header-bar">
        <h1>Gestione Spese</h1>
        <button class="logout-btn" onclick="logout()">Esci</button>
      </div>

      <div class="filter-container">
        <label for="month-filter">📅 Periodo:</label>
        <select id="month-filter" onchange="applyFilter()">
          <option value="all">Tutti i movimenti</option>
        </select>
      </div>

      <div class="dashboard">
        <div class="card">
          <h3>Saldo</h3>
          <p id="total-balance" class="balance">€0.00</p>
        </div>
        <div class="card">
          <h3>Entrate</h3>
          <p id="total-income" class="income-val">+€0.00</p>
        </div>
        <div class="card">
          <h3>Uscite</h3>
          <p id="total-expense" class="expense-val">-€0.00</p>
        </div>
      </div>

      <form id="tx-form">
        <input type="text" id="descrizione" placeholder="Descrizione" required>
        <div class="form-group">
          <input type="number" id="importo" placeholder="Importo (€)" step="0.01" min="0.01" required>
          <input type="date" id="data" required>
        </div>
        <div class="form-group">
          <select id="tipo">
            <option value="uscita">Uscita</option>
            <option value="entrata">Entrata</option>
          </select>
          <select id="categoria">
            <option value="Cibo">Cibo & Spesa</option>
            <option value="Trasporti">Trasporti & Auto</option>
            <option value="Casa">Casa & Bollette</option>
            <option value="Svago">Svago & Intrattenimento</option>
            <option value="Lavoro">Lavoro & Stipendio</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <button type="submit">Aggiungi Movimento</button>
      </form>

      <div class="transactions">
        <h2>Storico Movimenti</h2>
        <ul id="tx-list"></ul>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://owqspxfgueqzivrwvupp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HEp-x3FM0m_Ym8h7O1etFw_0ZojwUk7';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let transazioni = [];
    let transazioniFiltrate = [];

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const balanceEl = document.getElementById('total-balance');
    const incomeEl = document.getElementById('total-income');
    const expenseEl = document.getElementById('total-expense');
    const listEl = document.getElementById('tx-list');
    const formEl = document.getElementById('tx-form');
    const dateInput = document.getElementById('data');
    const filterSelect = document.getElementById('month-filter');

    const nomiMesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
    dateInput.valueAsDate = new Date();

    // Monitoraggio dello stato di autenticazione dell'utente
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        fetchTransazioni();
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    async function signUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        alert('Inserisci email e password');
        return;
      }
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert('Registrazione effettuata! Se la conferma via e-mail è attiva nel tuo progetto Supabase, controlla la tua casella di posta per confermare.');
    }

    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        alert('Inserisci email e password');
        return;
      }
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Errore di accesso: ' + error.message);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    async function fetchTransazioni() {
      const { data, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('data', { ascending: false });

      if (error) {
        console.error('Errore:', error);
        return;
      }

      transazioni = data;
      populateMonthFilter();
      applyFilter();
    }

    function populateMonthFilter() {
      const currentSelection = filterSelect.value;
      filterSelect.innerHTML = '<option value="all">Tutti i movimenti</option>';

      const periodiSet = new Set();
      transazioni.forEach(t => {
        if (t.data) {
          const [year, month] = t.data.split('-');
          periodiSet.add(`${year}-${month}`);
        }
      });

      Array.from(periodiSet).sort().reverse().forEach(periodo => {
        const [year, month] = periodo.split('-');
        const option = document.createElement('option');
        option.value = periodo;
        option.textContent = `${nomiMesi[parseInt(month, 10) - 1]} ${year}`;
        filterSelect.appendChild(option);
      });

      if (Array.from(filterSelect.options).some(opt => opt.value === currentSelection)) {
        filterSelect.value = currentSelection;
      }
    }

    function applyFilter() {
      const selected = filterSelect.value;
      transazioniFiltrate = selected === 'all' 
        ? [...transazioni] 
        : transazioni.filter(t => t.data && t.data.startsWith(selected));
      renderUI();
    }

    function updateValues() {
      const total = transazioniFiltrate.reduce((acc, t) => acc + (t.tipo === 'entrata' ? parseFloat(t.importo) : -parseFloat(t.importo)), 0).toFixed(2);
      const income = transazioniFiltrate.filter(t => t.tipo === 'entrata').reduce((acc, t) => acc + parseFloat(t.importo), 0).toFixed(2);
      const expense = transazioniFiltrate.filter(t => t.tipo === 'uscita').reduce((acc, t) => acc + parseFloat(t.importo), 0).toFixed(2);

      balanceEl.innerText = `€${total}`;
      incomeEl.innerText = `+€${income}`;
      expenseEl.innerText = `-€${expense}`;
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const [year, month, day] = dateString.split('-');
      return `${day}/${month}/${year}`;
    }

    function renderUI() {
      listEl.innerHTML = '';
      if (transazioniFiltrate.length === 0) {
        listEl.innerHTML = '<p class="empty-msg">Nessuna transazione presente.</p>';
      } else {
        transazioniFiltrate.forEach(t => {
          const isIncome = t.tipo === 'entrata';
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="tx-info">
              <span class="tx-title">${t.descrizione}</span>
              <div class="tx-details">
                <span>📅 ${formatDate(t.data)}</span>
                <span>• ${t.categoria}</span>
              </div>
            </div>
            <div class="tx-amount ${isIncome ? 'plus' : 'minus'}">
              ${isIncome ? '+' : '-'}€${parseFloat(t.importo).toFixed(2)}
              <button class="delete-btn" onclick="removeTransaction('${t.id}')">&times;</button>
            </div>
          `;
          listEl.appendChild(li);
        });
      }
      updateValues();
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const descrizione = document.getElementById('descrizione').value.trim();
      const importo = parseFloat(document.getElementById('importo').value);
      const dataVal = dateInput.value;
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;

      if (!descrizione || isNaN(importo) || !dataVal) return;

      const nuovaTx = { 
        descrizione, 
        importo, 
        data: dataVal, 
        tipo, 
        categoria, 
        user_id: currentUser.id 
      };

      const { data, error } = await supabaseClient
        .from('transactions')
        .insert([nuovaTx])
        .select();

      if (error) {
        alert('Errore salvataggio: ' + error.message);
        return;
      }

      transazioni.unshift(data[0]);
      populateMonthFilter();
      applyFilter();
      formEl.reset();
      dateInput.valueAsDate = new Date();
    });

    window.removeTransaction = async function(id) {
      const { error } = await supabaseClient
        .from('transactions')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Errore eliminazione: ' + error.message);
        return;
      }
      transazioni = transazioni.filter(t => t.id !== id);
      populateMonthFilter();
      applyFilter();
    };
  </script>
</body>
</html>
