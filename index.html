<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Spese Personali</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 16px; color: #333; }
    .hidden { display: none !important; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1, h2, h3 { margin-top: 0; }
    
    /* Form & Input */
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 1rem; }
    button { background-color: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { background-color: #0056b3; }
    .btn-secondary { background-color: #e5e5ea; color: #333; }
    .btn-danger { background-color: #ff3b30; color: white; }
    
    /* Layout Auth */
    .auth-container { max-width: 400px; margin: 40px auto; }
    .auth-links { text-align: center; margin-top: 10px; }
    .auth-links a { color: #007aff; text-decoration: none; cursor: pointer; font-size: 0.9rem; }

    /* Nav Tabs */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .nav-tabs button { flex: 1; margin-bottom: 0; padding: 10px; white-space: nowrap; }
    .nav-tabs button.active { background-color: #007aff; color: white; }
    .nav-tabs button:not(.active) { background-color: #e5e5ea; color: #333; }

    /* Summary Dashboard Header & Grid */
    .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .toggle-visibility-btn { width: auto; background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; color: #007aff; margin-bottom: 0; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 16px; }
    .summary-box { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .summary-box small { font-size: 0.75rem; color: #666; text-transform: uppercase; }
    .summary-box div { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
    .saldo { color: #007aff; }
    .entrate { color: #34c759; }
    .uscite { color: #ff3b30; }

    /* Header Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-bar h1 { margin: 0; font-size: 1.4rem; }
    .logout-btn { width: auto; padding: 6px 12px; margin-bottom: 0; background: #ff3b30; font-size: 0.85rem; }

    /* List items */
    .item-list { list-style: none; padding: 0; margin: 0; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .item-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- ================= VISTA AUTENTICAZIONE ================= -->
  <div id="auth-section" class="auth-container">
    <div class="card">
      <h2 id="auth-title" style="text-align:center;">Accedi</h2>
      
      <!-- Login & Registrazione -->
      <div id="login-fields">
        <input type="email" id="auth-email" placeholder="Email" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <div style="display: flex; gap: 8px;">
          <button onclick="login()">Accedi</button>
          <button onclick="signUp()" class="btn-secondary">Registrati</button>
        </div>
        <div class="auth-links">
          <a onclick="showResetView()">Password dimenticata?</a>
        </div>
      </div>

      <!-- Recupero Password -->
      <div id="reset-fields" class="hidden">
        <p style="font-size: 0.85rem; color: #666;">Inserisci la tua email per ricevere il link di ripristino.</p>
        <input type="email" id="reset-email" placeholder="Email">
        <div style="display: flex; gap: 8px;">
          <button onclick="resetPassword()">Invia Link</button>
          <button onclick="showLoginView()" class="btn-secondary">Annulla</button>
        </div>
      </div>
    </div>
  </div>


  <!-- ================= VISTA APP PRINCIPALE ================= -->
  <div id="app-section" class="hidden">
    <div class="header-bar">
      <h1>Gestione Spese</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Navigazione Tab -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-nuovo')">+ Nuovo</button>
      <button class="tab-btn" onclick="switchTab('tab-storico')">📋 Storico</button>
      <button class="tab-btn" onclick="switchTab('tab-gestione')">⚙️ Gestione</button>
    </div>

    <!-- TAB 1: NUOVO MOVIMENTO & RIEPILOGO -->
    <div id="tab-nuovo" class="tab-content">
      
      <!-- Riepilogo con pulsante mostra/nascondi -->
      <div style="margin-bottom: 8px;">
        <div class="summary-header">
          <span style="font-weight: bold; font-size: 0.9rem; color: #666;">Riepilogo Totale</span>
          <button id="btn-toggle-visibility" class="toggle-visibility-btn" onclick="toggleSummaryVisibility()">👁️ Mostra</button>
        </div>
        <div class="summary-grid">
          <div class="summary-box">
            <small>Saldo</small>
            <div id="summary-saldo" class="saldo">••••••</div>
          </div>
          <div class="summary-box">
            <small>Entrate</small>
            <div id="summary-entrate" class="entrate">••••••</div>
          </div>
          <div class="summary-box">
            <small>Uscite</small>
            <div id="summary-uscite" class="uscite">••••••</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Aggiungi Movimento</h3>
        <form id="form-transaction">
          <input type="text" id="descrizione" placeholder="Descrizione" required>
          <input type="number" step="0.01" id="importo" placeholder="Importo (€)" required>
          <input type="date" id="data" required>
          
          <!-- Cliente / Fornitore (con datalist dinamico) -->
          <input type="text" id="entita" placeholder="Cliente / Fornitore (Opzionale)" list="entita-datalist">
          <datalist id="entita-datalist"></datalist>

          <select id="tipo">
            <option value="uscita">Uscita</option>
            <option value="entrata">Entrata</option>
          </select>

          <!-- Categorie dinamiche -->
          <select id="categoria"></select>

          <button type="submit">Salva Movimento</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: STORICO MOVIMENTI -->
    <div id="tab-storico" class="tab-content card hidden">
      <h3>Storico Transazioni</h3>
      <ul id="list-transactions" class="item-list"></ul>
    </div>

    <!-- TAB 3: GESTIONE ANAGRAFICHE -->
    <div id="tab-gestione" class="tab-content hidden">
      <!-- Gestione Categorie -->
      <div class="card">
        <h3>📂 Gestione Categorie</h3>
        <form id="form-category" style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="new-cat-name" placeholder="Nome Categoria" required style="flex:2;">
          <select id="new-cat-type" style="flex:1;">
            <option value="uscita">Uscita</option>
            <option value="entrata">Entrata</option>
          </select>
          <button type="submit" style="width: auto;">+ Aggiungi</button>
        </form>
        <ul id="list-categories" class="item-list"></ul>
      </div>

      <!-- Gestione Clienti / Fornitori -->
      <div class="card">
        <h3>👥 Gestione Clienti / Fornitori</h3>
        <form id="form-entity" style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="new-entity-name" placeholder="Nome Cliente / Fornitore" required style="flex:2;">
          <select id="new-entity-type" style="flex:1;">
            <option value="fornitore">Fornitore</option>
            <option value="cliente">Cliente</option>
            <option value="entrambi">Entrambi</option>
          </select>
          <button type="submit" style="width: auto;">+ Aggiungi</button>
        </form>
        <ul id="list-entities" class="item-list"></ul>
      </div>
    </div>

  </div>


  <!-- ================= SCRIPT JAVASCRIPT ================= -->
  <script>
    // 1. CONFIGURAZIONE SUPABASE
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // Sostituisci con il tuo URL
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Sostituisci con la tua chiave
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Variabili di Stato
    let currentUser = null;
    let transazioni = [];
    let categorie = [];
    let entitaList = [];
    let isSummaryVisible = false; // Di default i saldi sono nascosti

    // Inizializzazione data odierna
    document.getElementById('data').valueAsDate = new Date();

    // Controlla la sessione all'avvio
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        onLoginSuccess(session.user);
      }
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (session) {
        onLoginSuccess(session.user);
      } else {
        onLogoutSuccess();
      }
    });

    // ================= GESTIONE AUTH =================
    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Errore login: ' + error.message);
    }

    async function signUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert('Errore registrazione: ' + error.message);
      else alert('Registrazione effettuata! Controlla la mail per la conferma.');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    async function resetPassword() {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) return alert('Inserisci l\'indirizzo email');
      
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

      if (error) {
        alert('Errore: ' + error.message);
      } else {
        alert('Email di ripristino inviata! Controlla la tua casella di posta.');
        showLoginView();
      }
    }

    function showResetView() {
      document.getElementById('login-fields').classList.add('hidden');
      document.getElementById('reset-fields').classList.remove('hidden');
      document.getElementById('auth-title').innerText = "Recupero Password";
    }

    function showLoginView() {
      document.getElementById('reset-fields').classList.add('hidden');
      document.getElementById('login-fields').classList.remove('hidden');
      document.getElementById('auth-title').innerText = "Accedi";
    }

    async function onLoginSuccess(user) {
      currentUser = user;
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      await loadMasterData();
      await loadTransactions();
    }

    function onLogoutSuccess() {
      currentUser = null;
      transazioni = [];
      categorie = [];
      entitaList = [];
      isSummaryVisible = false;
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    // ================= GESTIONE TAB NAVIGAZIONE =================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.remove('hidden');
      event.target.classList.add('active');
    }

    // ================= GESTIONE VISIBILITÀ RIEPILOGO =================
    function toggleSummaryVisibility() {
      isSummaryVisible = !isSummaryVisible;
      const btn = document.getElementById('btn-toggle-visibility');
      if (isSummaryVisible) {
        btn.innerText = '🙈 Nascondi';
      } else {
        btn.innerText = '👁️ Mostra';
      }
      updateDashboard();
    }

    // ================= CARICAMENTO ANAGRAFICHE (CATEGORIE & ENTITÀ) =================
    async function loadMasterData() {
      if (!currentUser) return;

      // Carica Categorie
      const { data: catData, error: catErr } = await supabaseClient
        .from('categories')
        .select('*')
        .order('name');
      if (!catErr) categorie = catData || [];

      // Carica Entità (Clienti/Fornitori)
      const { data: entData, error: entErr } = await supabaseClient
        .from('entities')
        .select('*')
        .order('name');
      if (!entErr) entitaList = entData || [];

      renderMasterDataLists();
      populateDropdowns();
    }

    function renderMasterDataLists() {
      // Render Categorie
      const catListEl = document.getElementById('list-categories');
      catListEl.innerHTML = categorie.map(c => `
        <li>
          <span><strong>${c.name}</strong> <small>(${c.type})</small></span>
          <button onclick="deleteCategory(${c.id})" class="btn-danger" style="width:auto; padding: 4px 8px;">❌</button>
        </li>
      `).join('');

      // Render Entità
      const entListEl = document.getElementById('list-entities');
      entListEl.innerHTML = entitaList.map(e => `
        <li>
          <span><strong>${e.name}</strong> <small>(${e.type})</small></span>
          <button onclick="deleteEntity(${e.id})" class="btn-danger" style="width:auto; padding: 4px 8px;">❌</button>
        </li>
      `).join('');
    }

    function populateDropdowns() {
      // Popola select Categoria
      const catSelect = document.getElementById('categoria');
      if (categorie.length === 0) {
        catSelect.innerHTML = '<option value="">Nessuna categoria (aggiungila in Gestione)</option>';
      } else {
        catSelect.innerHTML = categorie.map(c => `<option value="${c.name}">${c.name} (${c.type})</option>`).join('');
      }

      // Popola datalist Entità
      const datalist = document.getElementById('entita-datalist');
      datalist.innerHTML = entitaList.map(e => `<option value="${e.name}">`).join('');
    }

    // Salvataggio Nuova Categoria
    document.getElementById('form-category').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-cat-name').value.trim();
      const type = document.getElementById('new-cat-type').value;

      if (!name) return;

      const { data, error } = await supabaseClient
        .from('categories')
        .insert([{ name, type, user_id: currentUser.id }])
        .select();

      if (error) {
        alert('Errore aggiunta categoria: ' + error.message);
      } else {
        categorie.push(data[0]);
        renderMasterDataLists();
        populateDropdowns();
        document.getElementById('new-cat-name').value = '';
      }
    });

    // Salvataggio Nuova Entità
    document.getElementById('form-entity').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-entity-name').value.trim();
      const type = document.getElementById('new-entity-type').value;

      if (!name) return;

      const { data, error } = await supabaseClient
        .from('entities')
        .insert([{ name, type, user_id: currentUser.id }])
        .select();

      if (error) {
        alert('Errore aggiunta entità: ' + error.message);
      } else {
        entitaList.push(data[0]);
        renderMasterDataLists();
        populateDropdowns();
        document.getElementById('new-entity-name').value = '';
      }
    });

    // Eliminazione Categoria ed Entità
    async function deleteCategory(id) {
      if (!confirm('Eliminare questa categoria?')) return;
      const { error } = await supabaseClient.from('categories').delete().eq('id', id);
      if (!error) {
        categorie = categorie.filter(c => c.id !== id);
        renderMasterDataLists();
        populateDropdowns();
      } else {
        alert('Errore: ' + error.message);
      }
    }

    async function deleteEntity(id) {
      if (!confirm('Eliminare questo cliente/fornitore?')) return;
      const { error } = await supabaseClient.from('entities').delete().eq('id', id);
      if (!error) {
        entitaList = entitaList.filter(e => e.id !== id);
        renderMasterDataLists();
        populateDropdowns();
      } else {
        alert('Errore: ' + error.message);
      }
    }


    // ================= GESTIONE TRANSAZIONI =================
    async function loadTransactions() {
      const { data, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('data', { ascending: false });

      if (error) {
        console.error('Errore caricamento transazioni:', error);
        return;
      }

      transazioni = data || [];
      renderTransactions();
      updateDashboard();
    }

    document.getElementById('form-transaction').addEventListener('submit', async (e) => {
      e.preventDefault();
      const descrizione = document.getElementById('descrizione').value.trim();
      const importo = parseFloat(document.getElementById('importo').value);
      const dataVal = document.getElementById('data').value;
      const entita = document.getElementById('entita').value.trim();
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;

      if (!descrizione || isNaN(importo) || !dataVal) {
        alert('Compila tutti i campi obbligatori');
        return;
      }

      const nuovaTx = { 
        descrizione, 
        entita: entita || null,
        importo, 
        data: dataVal, 
        tipo, 
        categoria: categoria,
        user_id: currentUser.id
      };

      const { data, error } = await supabaseClient
        .from('transactions')
        .insert([nuovaTx])
        .select();

      if (error) {
        alert('Errore salvataggio: ' + error.message);
        return;
      }

      transazioni.unshift(data[0]);
      renderTransactions();
      updateDashboard();
      
      document.getElementById('form-transaction').reset();
      document.getElementById('data').valueAsDate = new Date();
      alert('Movimento salvato con successo!');
    });

    function renderTransactions() {
      const listEl = document.getElementById('list-transactions');
      listEl.innerHTML = transazioni.map(t => `
        <li>
          <div>
            <strong>${t.descrizione}</strong> <small style="color:#666;">(${t.categoria || 'Generale'})</small><br>
            <small style="color:#888;">${t.data} ${t.entita ? '| ' + t.entita : ''}</small>
          </div>
          <div style="font-weight:bold; color: ${t.tipo === 'entrata' ? '#34c759' : '#ff3b30'};">
            ${t.tipo === 'entrata' ? '+' : '-'}€${parseFloat(t.importo).toFixed(2)}
          </div>
        </li>
      `).join('');
    }

    function updateDashboard() {
      let entrate = 0;
      let uscite = 0;

      transazioni.forEach(t => {
        const val = parseFloat(t.importo) || 0;
        if (t.tipo === 'entrata') entrate += val;
        else uscite += val;
      });

      const saldo = entrate - uscite;

      const saldoEl = document.getElementById('summary-saldo');
      const entrateEl = document.getElementById('summary-entrate');
      const usciteEl = document.getElementById('summary-uscite');

      if (isSummaryVisible) {
        saldoEl.innerText = `€${saldo.toFixed(2)}`;
        entrateEl.innerText = `+€${entrate.toFixed(2)}`;
        usciteEl.innerText = `-€${uscite.toFixed(2)}`;
      } else {
        saldoEl.innerText = '••••••';
        entrateEl.innerText = '••••••';
        usciteEl.innerText = '••••••';
      }
    }
  </script>
</body>
</html>
