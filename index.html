<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Spese Personali</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js per i Grafici -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 16px; color: #333; }
    .hidden { display: none !important; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1, h2, h3 { margin-top: 0; }
    
    /* Form & Input */
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 1rem; }
    button { background-color: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { background-color: #0056b3; }
    .btn-secondary { background-color: #e5e5ea; color: #333; }
    .btn-danger { background-color: #ff3b30; color: white; }
    
    /* Layout Auth */
    .auth-container { max-width: 400px; margin: 40px auto; }
    .auth-links { text-align: center; margin-top: 10px; }
    .auth-links a { color: #007aff; text-decoration: none; cursor: pointer; font-size: 0.9rem; }

    /* Nav Tabs */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .nav-tabs button { flex: 1; margin-bottom: 0; padding: 10px; white-space: nowrap; }
    .nav-tabs button.active { background-color: #007aff; color: white; }
    .nav-tabs button:not(.active) { background-color: #e5e5ea; color: #333; }

    /* Summary Dashboard Header & Grid */
    .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .toggle-visibility-btn { width: auto; background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; color: #007aff; margin-bottom: 0; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 16px; }
    .summary-box { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .summary-box small { font-size: 0.75rem; color: #666; text-transform: uppercase; }
    .summary-box div { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
    .saldo { color: #007aff; }
    .entrate { color: #34c759; }
    .uscite { color: #ff3b30; }

    /* Header Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-bar h1 { margin: 0; font-size: 1.4rem; }
    .logout-btn { width: auto; padding: 6px 12px; margin-bottom: 0; background: #ff3b30; font-size: 0.85rem; }

    /* List items */
    .item-list { list-style: none; padding: 0; margin: 0; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .item-list li:last-child { border-bottom: none; }

    /* Contenitori Grafici */
    .chart-container { position: relative; width: 100%; max-height: 350px; margin-top: 12px; }
  </style>
</head>
<body>

  <!-- ================= VISTA AUTENTICAZIONE ================= -->
  <div id="auth-section" class="auth-container">
    <div class="card">
      <h2 id="auth-title" style="text-align:center;">Accedi</h2>
      
      <div id="login-fields">
        <input type="email" id="auth-email" placeholder="Email" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <div style="display: flex; gap: 8px;">
          <button onclick="login()">Accedi</button>
          <button onclick="signUp()" class="btn-secondary">Registrati</button>
        </div>
        <div class="auth-links">
          <a onclick="showResetView()">Password dimenticata?</a>
        </div>
      </div>

      <div id="reset-fields" class="hidden">
        <p style="font-size: 0.85rem; color: #666;">Inserisci la tua email per ricevere il link di ripristino.</p>
        <input type="email" id="reset-email" placeholder="Email">
        <div style="display: flex; gap: 8px;">
          <button onclick="resetPassword()">Invia Link</button>
          <button onclick="showLoginView()" class="btn-secondary">Annulla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= VISTA APP PRINCIPALE ================= -->
  <div id="app-section" class="hidden">
    <div class="header-bar">
      <h1>Gestione Spese</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Navigazione Tab -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-nuovo')">+ Nuovo</button>
      <button class="tab-btn" onclick="switchTab('tab-storico')">📋 Storico</button>
      <button class="tab-btn" onclick="switchTab('tab-report')">📊 Report</button>
      <button class="tab-btn" onclick="switchTab('tab-gestione')">⚙️ Gestione</button>
    </div>

    <!-- TAB 1: NUOVO MOVIMENTO -->
    <div id="tab-nuovo" class="tab-content">
      <div style="margin-bottom: 8px;">
        <div class="summary-header">
          <span style="font-weight: bold; font-size: 0.9rem; color: #666;">Riepilogo Totale</span>
          <button id="btn-toggle-visibility" class="toggle-visibility-btn" onclick="toggleSummaryVisibility()">👁️ Mostra</button>
        </div>
        <div class="summary-grid">
          <div class="summary-box">
            <small>Saldo</small>
            <div id="summary-saldo" class="saldo">••••••</div>
          </div>
          <div class="summary-box">
            <small>Entrate</small>
            <div id="summary-entrate" class="entrate">••••••</div>
          </div>
          <div class="summary-box">
            <small>Uscite</small>
            <div id="summary-uscite" class="uscite">••••••</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Aggiungi Movimento</h3>
        <form id="form-transaction">
          <input type="text" id="descrizione" placeholder="Descrizione" required>
          <input type="number" step="0.01" id="importo" placeholder="Importo (€)" required>
          <input type="date" id="data" required>
          
          <select id="entita">
            <option value="">-- Caricamento Clienti/Fornitori... --</option>
          </select>

          <select id="tipo">
            <option value="uscita">Uscita</option>
            <option value="entrata">Entrata</option>
          </select>

          <select id="categoria"></select>

          <button type="submit">Salva Movimento</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: STORICO MOVIMENTI -->
    <div id="tab-storico" class="tab-content card hidden">
      <h3>Storico Transazioni</h3>
      <ul id="list-transactions" class="item-list"></ul>
    </div>

    <!-- TAB 3: REPORT & GRAFICI -->
    <div id="tab-report" class="tab-content hidden">
      <!-- GRAFICO 1: TORTA (CATEGORIE) -->
      <div class="card">
        <h3>🍕 Spese per Categoria</h3>
        <div class="chart-container">
          <canvas id="chart-categories"></canvas>
        </div>
      </div>

      <!-- GRAFICO 2: BARRE (CLIENTI / FORNITORI) -->
      <div class="card">
        <h3>📊 Totali per Cliente / Fornitore</h3>
        <div class="chart-container">
          <canvas id="chart-entities"></canvas>
        </div>
      </div>
    </div>

    <!-- TAB 4: GESTIONE CATEGORIE -->
    <div id="tab-gestione" class="tab-content hidden">
      <div class="card">
        <h3>📂 Gestione Categorie</h3>
        <form id="form-category" style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="new-cat-name" placeholder="Nome Categoria" required style="flex:2;">
          <select id="new-cat-type" style="flex:1;">
            <option value="uscita">Uscita</option>
            <option value="entrata">Entrata</option>
          </select>
          <button type="submit" style="width: auto;">+ Aggiungi</button>
        </form>
        <ul id="list-categories" class="item-list"></ul>
      </div>
    </div>

  </div>

  <!-- ================= SCRIPT JAVASCRIPT ================= -->
  <script>
    const SUPABASE_URL = 'https://owqspxfgueqzivrwvupp.supabase.co'; // Sostituisci con il tuo URL
    const SUPABASE_ANON_KEY = 'sb_publishable_HEp-x3FM0m_Ym8h7O1etFw_0ZojwUk7'; // Sostituisci con la tua chiave 

    const supabaseProvider = window.supabase || supabase;
    const supabaseClient = supabaseProvider.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const defaultCategories = [
      { id: 'def-1', name: 'Casa & Utenze', type: 'uscita' },
      { id: 'def-2', name: 'Spesa & Cibo', type: 'uscita' },
      { id: 'def-3', name: 'Trasporti & Auto', type: 'uscita' },
      { id: 'def-4', name: 'Svago & Tempo Libero', type: 'uscita' },
      { id: 'def-5', name: 'Salute & Benessere', type: 'uscita' },
      { id: 'def-6', name: 'Shopping & Abbigliamento', type: 'uscita' },
      { id: 'def-7', name: 'Stipendio', type: 'entrata' },
      { id: 'def-8', name: 'Rimborso', type: 'entrata' },
      { id: 'def-9', name: 'Altro', type: 'uscita' }
    ];

    let currentUser = null;
    let transazioni = [];
    let categorie = [...defaultCategories];
    let entitaList = [];
    let isSummaryVisible = false;

    // Istanze Grafici Chart.js
    let categoriesChartInstance = null;
    let entitiesChartInstance = null;

    document.getElementById('data').valueAsDate = new Date();

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) onLoginSuccess(session.user);
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (session) onLoginSuccess(session.user);
      else onLogoutSuccess();
    });

    async function login() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('Inserisci email e password');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Errore login: ' + error.message);
      else if (data.user) onLoginSuccess(data.user);
    }

    async function signUp() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('Inserisci email e password');

      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert('Errore registrazione: ' + error.message);
      else alert('Registrazione effettuata! Controlla la mail per la conferma.');
    }

    async function logout() { await supabaseClient.auth.signOut(); }

    async function resetPassword() {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) return alert('Inserisci l\'indirizzo email');
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
      if (error) alert('Errore: ' + error.message);
      else { alert('Email di ripristino inviata!'); showLoginView(); }
    }

    function showResetView() {
      document.getElementById('login-fields').classList.add('hidden');
      document.getElementById('reset-fields').classList.remove('hidden');
      document.getElementById('auth-title').innerText = "Recupero Password";
    }

    function showLoginView() {
      document.getElementById('reset-fields').classList.add('hidden');
      document.getElementById('login-fields').classList.remove('hidden');
      document.getElementById('auth-title').innerText = "Accedi";
    }

    async function onLoginSuccess(user) {
      currentUser = user;
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      await loadMasterData();
      await loadTransactions();
    }

    function onLogoutSuccess() {
      currentUser = null;
      transazioni = [];
      categorie = [...defaultCategories];
      entitaList = [];
      isSummaryVisible = false;
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.remove('hidden');
      event.target.classList.add('active');

      if (tabId === 'tab-report') {
        renderReports();
      }
    }

    function toggleSummaryVisibility() {
      isSummaryVisible = !isSummaryVisible;
      document.getElementById('btn-toggle-visibility').innerText = isSummaryVisible ? '🙈 Nascondi' : '👁️ Mostra';
      updateDashboard();
    }

    async function loadMasterData() {
      if (!currentUser) return;

      const { data: catData, error: catErr } = await supabaseClient
        .from('categories')
        .select('*')
        .order('name');

      categorie = (!catErr && catData && catData.length > 0) ? [...defaultCategories, ...catData] : [...defaultCategories];

      let { data: entData, error: entErr } = await supabaseClient
        .from('entities')
        .select('*')
        .order('name');

      // Se la tabella 'entities' è vuota, recupera dai vecchi movimenti 'transactions'
      if (!entErr && (!entData || entData.length === 0)) {
        const { data: txData } = await supabaseClient
          .from('transactions')
          .select('entita')
          .not('entita', 'is', null);

        if (txData && txData.length > 0) {
          const nomiUnici = [...new Set(txData.map(t => t.entita ? t.entita.trim() : '').filter(nome => nome !== ''))];
          if (nomiUnici.length > 0) {
            const nuoveEntita = nomiUnici.map(nome => ({ name: nome, user_id: currentUser.id }));
            const { data: insertedData } = await supabaseClient.from('entities').insert(nuoveEntita).select();
            if (insertedData) entData = insertedData;
          }
        }
      }

      entitaList = entData || [];
      renderMasterDataLists();
      populateDropdowns();
    }

    function renderMasterDataLists() {
      document.getElementById('list-categories').innerHTML = categorie.map(c => `
        <li>
          <span><strong>${c.name}</strong> <small>(${c.type})</small></span>
          ${String(c.id).startsWith('def-') ? '<small style="color:#999;">(Predefinita)</small>' : `<button onclick="deleteCategory(${c.id})" class="btn-danger" style="width:auto; padding: 4px 8px;">❌</button>`}
        </li>
      `).join('');
    }

    function populateDropdowns() {
      const catSelect = document.getElementById('categoria');
      if (catSelect) catSelect.innerHTML = categorie.map(c => `<option value="${c.name}">${c.name} (${c.type})</option>`).join('');

      const entSelect = document.getElementById('entita');
      if (entSelect) {
        entSelect.innerHTML = entitaList.length === 0 
          ? `<option value="">-- Nessun Cliente/Fornitore trovato --</option>`
          : `<option value="">-- Nessun Cliente/Fornitore --</option>` + entitaList.map(e => `<option value="${e.name}">${e.name}</option>`).join('');
      }
    }

    document.getElementById('form-category').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('new-cat-name').value.trim();
      const type = document.getElementById('new-cat-type').value;
      if (!name) return;

      const { data, error } = await supabaseClient.from('categories').insert([{ name, type, user_id: currentUser.id }]).select();
      if (error) alert('Errore aggiunta categoria: ' + error.message);
      else {
        categorie.push(data[0]);
        renderMasterDataLists();
        populateDropdowns();
        document.getElementById('new-cat-name').value = '';
      }
    });

    async function deleteCategory(id) {
      if (!confirm('Eliminare questa categoria?')) return;
      const { error } = await supabaseClient.from('categories').delete().eq('id', id);
      if (!error) {
        categorie = categorie.filter(c => c.id !== id);
        renderMasterDataLists();
        populateDropdowns();
      } else alert('Errore: ' + error.message);
    }

    async function loadTransactions() {
      const { data, error } = await supabaseClient.from('transactions').select('*').order('data', { ascending: false });
      if (error) return console.error('Errore caricamento transazioni:', error);

      transazioni = data || [];
      renderTransactions();
      updateDashboard();
    }

    document.getElementById('form-transaction').addEventListener('submit', async (e) => {
      e.preventDefault();
      const descrizione = document.getElementById('descrizione').value.trim();
      const importo = parseFloat(document.getElementById('importo').value);
      const dataVal = document.getElementById('data').value;
      const entita = document.getElementById('entita').value;
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;

      if (!descrizione || isNaN(importo) || !dataVal) return alert('Compila tutti i campi obbligatori');

      const nuovaTx = { descrizione, entita: entita || null, importo, data: dataVal, tipo, categoria, user_id: currentUser.id };
      const { data, error } = await supabaseClient.from('transactions').insert([nuovaTx]).select();

      if (error) return alert('Errore salvataggio: ' + error.message);

      transazioni.unshift(data[0]);
      renderTransactions();
      updateDashboard();
      document.getElementById('form-transaction').reset();
      document.getElementById('data').valueAsDate = new Date();
      alert('Movimento salvato con successo!');
    });

    function renderTransactions() {
      document.getElementById('list-transactions').innerHTML = transazioni.map(t => `
        <li>
          <div>
            <strong>${t.descrizione}</strong> <small style="color:#666;">(${t.categoria || 'Generale'})</small><br>
            <small style="color:#888;">${t.data} ${t.entita ? '| ' + t.entita : ''}</small>
          </div>
          <div style="font-weight:bold; color: ${t.tipo === 'entrata' ? '#34c759' : '#ff3b30'};">
            ${t.tipo === 'entrata' ? '+' : '-'}€${parseFloat(t.importo).toFixed(2)}
          </div>
        </li>
      `).join('');
    }

    function updateDashboard() {
      let entrate = 0, uscite = 0;
      transazioni.forEach(t => {
        const val = parseFloat(t.importo) || 0;
        if (t.tipo === 'entrata') entrate += val;
        else uscite += val;
      });

      const saldo = entrate - uscite;
      document.getElementById('summary-saldo').innerText = isSummaryVisible ? `€${saldo.toFixed(2)}` : '••••••';
      document.getElementById('summary-entrate').innerText = isSummaryVisible ? `+€${entrate.toFixed(2)}` : '••••••';
      document.getElementById('summary-uscite').innerText = isSummaryVisible ? `-€${uscite.toFixed(2)}` : '••••••';
    }

    // ================= GESTIONE REPORT GRAFICI (CHART.JS) =================
    function renderReports() {
      const catTotals = {};
      const entTotals = {};

      transazioni.forEach(t => {
        const val = parseFloat(t.importo) || 0;
        const cat = t.categoria || 'Senza Categoria';
        const ent = t.entita || 'Nessuno';

        // Solo Uscite per la Torta delle Categorie
        if (t.tipo === 'uscita') {
          catTotals[cat] = (catTotals[cat] || 0) + val;
        }

        // Totali per Cliente/Fornitore (Entrate e Uscite)
        if (!entTotals[ent]) entTotals[ent] = { entrata: 0, uscita: 0 };
        entTotals[ent][t.tipo] += val;
      });

      // --- 1. GRAFICO A TORTA (Spese per Categoria) ---
      const catCtx = document.getElementById('chart-categories').getContext('2d');
      if (categoriesChartInstance) categoriesChartInstance.destroy();

      const catLabels = Object.keys(catTotals);
      const catData = Object.values(catTotals);

      categoriesChartInstance = new Chart(catCtx, {
        type: 'pie',
        data: {
          labels: catLabels,
          datasets: [{
            data: catData,
            backgroundColor: [
              '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', 
              '#9966FF', '#FF9F40', '#E7E9ED', '#8AC926'
            ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });

      // --- 2. GRAFICO A BARRE (Clienti / Fornitori) ---
      const entCtx = document.getElementById('chart-entities').getContext('2d');
      if (entitiesChartInstance) entitiesChartInstance.destroy();

      const entLabels = Object.keys(entTotals);
      const entEntrate = entLabels.map(lbl => entTotals[lbl].entrata);
      const entUscite = entLabels.map(lbl => entTotals[lbl].uscita);

      entitiesChartInstance = new Chart(entCtx, {
        type: 'bar',
        data: {
          labels: entLabels,
          datasets: [
            {
              label: 'Entrate (€)',
              data: entEntrate,
              backgroundColor: '#34c759'
            },
            {
              label: 'Uscite (€)',
              data: entUscite,
              backgroundColor: '#ff3b30'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true }
          },
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }
  </script>
</body>
</html>
